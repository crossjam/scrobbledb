# Generated by OpenSpec for GitHub Copilot coding agent support.

name: "Copilot Setup Steps"

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to the version that generated the committed scaffolding under
      # .agents/, .claude/, .github/, .opencode/ and .pi/. Bump this together with
      # `openspec update`, not independently.
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.12.0

      - name: Verify OpenSpec CLI
        run: |
          openspec --version
          test "$(openspec --version)" = "1.12.0"
