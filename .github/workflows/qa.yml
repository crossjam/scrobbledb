name: QA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicitly set permissions for security best practices
permissions:
  contents: read

jobs:
  qa:
    name: QA Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
      fail-fast: false
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync

      - name: Verify CLI docs are in sync
        env:
          COLUMNS: 100  # stabilize click help wrapping across environments
        run: |
          uv run poe docs:cli
          git diff --name-only --exit-code docs/commands

      - name: Run linting
        run: uv run poe lint
      
      - name: Run type checking
        run: uv run poe type
      
      - name: Run tests
        run: uv run poe test

      # Blocking: a known-vulnerable dependency fails the build. Runs after the
      # tests deliberately -- a new third-party advisory can appear on a day
      # nothing here changed, and halting before the tests would hide their
      # result behind it. If an advisory ever has no fixed release available,
      # record the decision explicitly with
      #   pip-audit --ignore-vuln <ID>
      # rather than making this step advisory again.
      - name: Run security audit
        run: uv run poe audit
