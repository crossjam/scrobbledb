[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrobbledb"
version = "1.2.0"
description = "Save data from last.fm/libre.fm to a SQLite database"
authors = [
    {name = "Jacob Kaplan-Moss", email = "jacob@jacobian.org"},
    {name = "Brian M. Dennis", email = "bmd@pirateninja.dev"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pylast>=3.1.0",
    "sqlite-utils>=4.0",
    "click>=7.0",
    "python-dateutil>=2.8.1",
    "platformdirs>=2.4.0",
    "rich>=10.11.0",
    "loguru>=0.7.3",
    "loguru-config",
    "textual>=0.85.0",
    "stamina>=24.2.0",
    "rapidfuzz>=3.0.0",
    "dateparser>=1.1.0",
    "click-default-group>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=5.2.2",
    "pytest-cov>=2.8.1",
    "cogapp>=3.4.1",
]
serve = [
    "datasette>=1.0a39",
    "datasette-mcp>=0.2",
]

[project.scripts]
scrobbledb = "scrobbledb.cli:cli"

[project.urls]
Repository = "https://github.com/crossjam/scrobbledb"

[dependency-groups]
dev = [
    "pytest>=7.0.1",
    "pytest-cov>=4.0.0",
    "poethepoet>=0.24.0",
    "ruff>=0.1.0",
    "ty",
    "types-python-dateutil>=2.8.0",
    "pip-audit>=2.0.0",
    "cogapp>=3.4.1",
    "datasette>=1.0a39",
    "datasette-mcp>=0.2",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrobbledb = ["default_loguru_config.toml"]
"scrobbledb.datasette_plugin" = ["*.yaml", "*.json"]

[tool.uv]
# Security floors for packages nothing in the tree pins, so a future
# re-resolution cannot silently drop back below a fixed release. Neither is a
# direct dependency, hence constraints rather than entries in [project]:
#   pip     - required unpinned by sqlite-utils and datasette (for their
#             `install` subcommands). CVE-2026-8643 installs entry points
#             outside the target directory; CVE-2026-13346 mishandles
#             doubly-encoded index URLs. Fixed in 26.1.2 and 26.2.
#   msgpack - via cachecontrol, for pip-audit's HTTP cache. CVE-2026-57585 is
#             an out-of-bounds read crashing a reused Unpacker. Fixed in 1.2.1.
#   anyio   - via httpx, starlette and mcp (pylast, datasette, datasette-mcp).
#             CVE-2026-63374 and CVE-2026-64847. Fixed in 4.14.2.
constraint-dependencies = ["pip>=26.2", "msgpack>=1.2.1", "anyio>=4.14.2"]

[tool.uv.sources]
loguru-config = { git = "https://github.com/crossjam/loguru-config" }

[tool.ty]
# Ty configuration - lenient settings for existing codebase
# Enable stricter checks gradually as type annotations are added

[tool.ty.rules]
# Ignore certain rules for now to allow gradual type annotation adoption
unresolved-import = "ignore"           # Allow unresolved imports (e.g., pkg_resources)
possibly-missing-attribute = "ignore"  # Allow potentially missing attributes
unsupported-operator = "ignore"        # Allow operators on Unknown types
invalid-parameter-default = "ignore"   # Allow None defaults for typed parameters
invalid-argument-type = "ignore"       # Allow arguments with Unknown types
unresolved-attribute = "ignore"        # Allow attributes on Unknown types

[tool.poe.tasks]
# Linting
[tool.poe.tasks.lint]
help = "Run ruff linter on source and test files"
cmd = "ruff check src/ tests/"

[tool.poe.tasks."lint:fix"]
help = "Run ruff linter and auto-fix issues"
cmd = "ruff check --fix src/ tests/"

# Type checking
[tool.poe.tasks.type]
help = "Run ty type checker on source files"
cmd = "ty check src/"

# Security auditing
[tool.poe.tasks.audit]
help = "Run pip-audit to check for known vulnerabilities"
cmd = "pip-audit"

# Testing
[tool.poe.tasks.test]
help = "Run pytest with verbose output"
cmd = "pytest -v"

[tool.poe.tasks."test:cov"]
help = "Run pytest with coverage report (terminal + HTML)"
cmd = "pytest --cov=scrobbledb --cov-report=term-missing --cov-report=html"

[tool.poe.tasks."test:quick"]
help = "Run pytest and stop on first failure"
cmd = "pytest -x"

# Documentation
[tool.poe.tasks."docs:cli"]
help = "Regenerate CLI help snippets across docs/commands"
cmd = "env PYTHONPATH=src COLUMNS=100 uv run cog -r docs/commands/*.md"

# Combined QA - run all checks
[tool.poe.tasks.qa]
help = "Run all QA checks (lint, type, audit, test)"
sequence = ["lint", "type", "test", "audit"]
ignore_fail = false
